name: Android TWA

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-twa.yml"
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build signed release APK and AAB"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build and lint debug TWA
        run: gradle -p android :app:assembleDebug :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: uvocab-twa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Require signing secrets
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
      - name: Restore ephemeral release keystore
        run: |
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          chmod 600 android/release.keystore
      - name: Build signed release APK and AAB
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
        run: gradle -p android :app:assembleRelease :app:bundleRelease :app:lintRelease --stacktrace

      - name: Verify production Digital Asset Links against release signer
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
        run: |
          set -euo pipefail
          FINGERPRINT="$(
            keytool -list -v               -keystore "$ANDROID_RELEASE_KEYSTORE_PATH"               -storepass "$ANDROID_RELEASE_KEYSTORE_PASSWORD"               -alias "$ANDROID_RELEASE_KEY_ALIAS"               | awk -F': ' '/SHA256:/{print $2; exit}'
          )"
          test -n "$FINGERPRINT"
          curl --fail --silent --show-error --location             --proto '=https' --tlsv1.2             https://uvocab.ir/.well-known/assetlinks.json             -o /tmp/assetlinks.json
          FINGERPRINT="$FINGERPRINT" python3 - <<'PY'
          import json
          import os

          with open("/tmp/assetlinks.json", "r", encoding="utf-8") as handle:
              statements = json.load(handle)

          fingerprint = os.environ["FINGERPRINT"].upper()
          expected_package = "ir.uvocab.app"
          expected_relation = "delegate_permission/common.handle_all_urls"

          valid = any(
              expected_relation in statement.get("relation", [])
              and statement.get("target", {}).get("namespace") == "android_app"
              and statement.get("target", {}).get("package_name") == expected_package
              and fingerprint in [
                  value.upper()
                  for value in statement.get("target", {}).get("sha256_cert_fingerprints", [])
              ]
              for statement in statements
          )

          if not valid:
              raise SystemExit(
                  "Production Digital Asset Links do not trust the certificate that signed this release."
              )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: uvocab-twa-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
