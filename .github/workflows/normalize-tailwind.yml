name: Refine Tailwind utilities
on:
  push:
    branches: [issue-131-tailwind-migration]
permissions:
  contents: write
jobs:
  refine:
    if: "!contains(github.event.head_commit.message, 'refine generated Tailwind names')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate readable utilities and breakpoint variants
        run: |
          node scripts/refine-tailwind-utilities.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ui): refine generated Tailwind names"
          git push
