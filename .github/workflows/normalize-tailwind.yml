name: Fix Tailwind theme references
on:
  push:
    branches: [issue-131-tailwind-migration]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'fix generated theme references')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Fix token references
        run: |
          node scripts/fix-tailwind-theme-classes.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): fix generated theme references"
          git push
