name: Normalize Tailwind classes
on:
  push:
    branches: [issue-131-tailwind-migration]
permissions:
  contents: write
jobs:
  normalize:
    if: "!contains(github.event.head_commit.message, 'normalize generated Tailwind classes')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Convert arbitrary declarations to named Tailwind utilities
        run: |
          node scripts/normalize-tailwind-classes.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ui): normalize generated Tailwind classes"
          git push
