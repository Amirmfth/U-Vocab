name: Apply Tailwind migration

on:
  push:
    branches:
      - issue-131-tailwind-migration

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply CSS to Tailwind migration
        run: |
          if [ ! -f src/app/core-experience.css ]; then
            echo "Migration already applied."
            exit 0
          fi
          node scripts/migrate-tailwind-ui.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ui): migrate application styles to Tailwind"
          git push
