name: Tailwind migration audit

on:
  push:
    branches:
      - issue-131-tailwind-migration

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit CSS to Tailwind migration
        run: node scripts/migrate-tailwind-ui.mjs --dry-run
