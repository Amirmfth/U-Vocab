name: Android TWA

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-twa.yml"
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build signed release APK and AAB"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build and lint debug TWA
        run: gradle -p android :app:assembleDebug :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: uvocab-twa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Require signing secrets
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
      - name: Restore ephemeral release keystore
        run: |
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          chmod 600 android/release.keystore
      - name: Build signed release APK and AAB
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
        run: gradle -p android :app:assembleRelease :app:bundleRelease :app:lintRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: uvocab-twa-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
