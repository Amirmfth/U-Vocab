name: Generate Web Push lock

on:
  push:
    branches:
      - feat/issue-104-web-push
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/generate-web-push-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-104-web-push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "Update Web Push package lock"
            git push origin HEAD:feat/issue-104-web-push
          fi
