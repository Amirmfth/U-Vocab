<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>U-Vocab · Offline</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#09090b;color:#f5f5f7}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% -10%,rgba(139,124,255,.18),transparent 34rem),#09090b}
    main{width:min(100%,520px);padding:28px;border:1px solid #2a2a31;border-radius:24px;background:#111114;box-shadow:0 18px 50px rgba(0,0,0,.28)}
    .mark{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;margin-bottom:22px;background:linear-gradient(145deg,#a79dff,#6657ee);color:white;font-weight:800;font-size:24px}
    h1{margin:0 0 10px;font-size:clamp(2rem,9vw,3rem);letter-spacing:-.045em}p{margin:0;color:#b4b4bf;line-height:1.65}.actions{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}
    button,a{min-height:46px;border-radius:13px;padding:0 16px;border:1px solid #3b3b46;background:#17171b;color:#f5f5f7;font:inherit;font-weight:650;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
    button:first-child{background:#f5f5f7;color:#101014;border-color:#f5f5f7}.note{margin-top:18px;font-size:.86rem;color:#7f7f8d}
  </style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">U</div>
  <h1 id="title">You’re offline</h1>
  <p id="body">U-Vocab needs a connection for account data, AI features, review updates, and synchronization. Your unsent form text remains in this browser tab.</p>
  <div class="actions">
    <button id="retry" type="button">Try again</button>
    <a href="/" id="home">Go to U-Vocab</a>
  </div>
  <p class="note" id="note">Private learning data is not stored in the shared offline cache.</p>
</main>
<script>
(function(){
  var fa=(navigator.language||"").toLowerCase().startsWith("fa");
  if(fa){
    document.documentElement.lang="fa";document.documentElement.dir="rtl";
    document.getElementById("title").textContent="آفلاین هستید";
    document.getElementById("body").textContent="برای داده‌های حساب، قابلیت‌های هوش مصنوعی، به‌روزرسانی مرورها و همگام‌سازی به اینترنت نیاز است. متن ارسال‌نشدهٔ فرم در همین برگهٔ مرورگر باقی می‌ماند.";
    document.getElementById("retry").textContent="تلاش دوباره";
    document.getElementById("home").textContent="رفتن به U-Vocab";
    document.getElementById("note").textContent="داده‌های خصوصی یادگیری در کش مشترک آفلاین ذخیره نمی‌شوند.";
  }
  document.getElementById("retry").addEventListener("click",function(){location.reload()});
})();
</script>
</body>
</html>
